<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Un pequeño detalle para ti 💙</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

@font-face{
  font-family:'Rounded';
  src: local('Segoe UI'), local('Arial');
}

@font-face{
  font-family:'Artistic';
  src: local('Georgia'), local('Times New Roman');
}

body{
  width:100vw;height:100vh;
  background:linear-gradient(180deg,#002b5c,#004b8d);
  font-family:'Rounded',sans-serif;
  overflow:hidden;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  padding:12px;
  width:100vw;height:100vh;
}

.card{perspective:1000px}

.card-inner{
  position:relative;
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,1.6,.4,1);
}

.card.flip .card-inner{transform:rotateY(180deg)}

.face{
  position:absolute;
  inset:0;
  border-radius:22px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  font-size:5vw;
  font-weight:700;
  white-space:pre-line;
}

.front{
  background:linear-gradient(135deg,#1ecad3,#00a7b3);
  color:#003b44;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.back{
  background:linear-gradient(135deg,#b8ffff,#5ad7e6);
  color:#003b44;
  transform:rotateY(180deg);
}

.final{
  font-family:'Artistic',serif;
  font-size:5.4vw;
  line-height:1.2;
}

canvas{
  position:absolute;
  inset:0;
  border-radius:22px;
  touch-action:none;
}

.locked::after{
  content:"🔒";
  position:absolute;
  font-size:12vw;
  z-index:3;
}

.explosion{
  position:absolute;
  width:20px;height:20px;
  border-radius:50%;
  background:#fff;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  animation:boom .8s ease-out forwards;
  pointer-events:none;
}

@keyframes boom{
  0%{opacity:1;box-shadow:0 0 0 0 #6ffcff}
  100%{
    opacity:0;
    box-shadow:
      0 0 0 40px rgba(111,252,255,.0),
      0 0 60px 30px rgba(111,252,255,.5);
  }
}

.plincito{
  animation:bounce 1s cubic-bezier(.34,1.56,.64,1);
}

@keyframes bounce{
  0%{transform:scale(.3)}
  60%{transform:scale(1.2)}
  100%{transform:scale(1)}
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
const mensajes = [
 "😅 Sigue intentando\nesto recién empieza",
 "😉 Vamos de nuevo\nconfía en mí",
 "🧸 Sorpresa:\nUn peluchito Plincito 💙",
 "🎂 Pista:\n12 días antes\nde tu cumple",
 "📅 Fecha clave:\n16 de enero",
 "📸 “Quizás debí tomar más fotos\nde cuando te tuve…”\n\n🎤 Bad Bunny 💙"
];

const grid=document.getElementById("grid");
let currentIndex=0;

function crearCard(index){
  const card=document.createElement("div");
  card.className="card";

  const inner=document.createElement("div");
  inner.className="card-inner";

  const front=document.createElement("div");
  front.className="face front locked";

  const back=document.createElement("div");
  back.className="face back";
  back.textContent=mensajes[index];

  if(index===5) back.classList.add("final");

  const canvas=document.createElement("canvas");
  front.appendChild(canvas);

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);
  grid.appendChild(card);

  const ctx=canvas.getContext("2d");

  function resize(){
    canvas.width=front.clientWidth;
    canvas.height=front.clientHeight;
    ctx.fillStyle="#b7f0f4";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation="destination-out";
  }
  resize();window.addEventListener("resize",resize);

  let draw=false;
  function scratch(e){
    if(!draw||index!==currentIndex)return;
    const r=canvas.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    ctx.beginPath();
    ctx.arc(x,y,canvas.width*.18,0,Math.PI*2);
    ctx.fill();
  }

  function check(){
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    let clear=0;
    for(let i=3;i<img.data.length;i+=4)
      if(img.data[i]===0)clear++;
    if(clear/(canvas.width*canvas.height)>0.35)unlock();
  }

  function unlock(){
    canvas.remove();
    front.classList.remove("locked");
    card.classList.add("flip");

    const boom=document.createElement("div");
    boom.className="explosion";
    card.appendChild(boom);
    setTimeout(()=>boom.remove(),800);

    if(index===2) back.classList.add("plincito");
    currentIndex++;
  }

  canvas.addEventListener("touchstart",()=>{if(index===currentIndex)draw=true});
  canvas.addEventListener("touchmove",scratch);
  canvas.addEventListener("touchend",()=>{draw=false;check()});

  canvas.addEventListener("mousedown",()=>{if(index===currentIndex)draw=true});
  canvas.addEventListener("mousemove",scratch);
  canvas.addEventListener("mouseup",()=>{draw=false;check()});
}

mensajes.forEach((_,i)=>crearCard(i));
</script>

</body>
</html>
