<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Un pequeño detalle para ti 💙</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  width:100vw;height:100vh;
  background:linear-gradient(180deg,#002b5c,#004b8d);
  font-family:'Segoe UI',Arial,sans-serif;
  overflow:hidden;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  padding:12px;
  width:100vw;height:100vh;
}

.card{perspective:1000px}
.card-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,1.6,.4,1);
}
.card.flip .card-inner{transform:rotateY(180deg)}

.face{
  position:absolute;inset:0;
  border-radius:22px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  font-size:5vw;
  font-weight:700;
  white-space:pre-line;
}

.front{
  background:linear-gradient(135deg,#1ecad3,#00a7b3);
  color:#003b44;
}

.back{
  background:linear-gradient(135deg,#b8ffff,#5ad7e6);
  color:#003b44;
  transform:rotateY(180deg);
}

canvas{
  position:absolute;
  inset:0;
  border-radius:22px;
  touch-action:none;
}

.locked::after{
  content:"🔒";
  position:absolute;
  font-size:12vw;
  z-index:3;
}

/* EXPLOSIÓN */
.explosion{
  position:absolute;
  inset:0;
  border-radius:22px;
  background:radial-gradient(circle, rgba(255,255,255,.9) 0%, rgba(111,252,255,.7) 35%, rgba(111,252,255,0) 75%);
  animation:boom 1s ease-out forwards;
}
@keyframes boom{
  0%{opacity:0;transform:scale(.4)}
  50%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.5)}
}

/* OVERLAY */
.overlay{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,#002b5c,#004b8d);
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.overlay-box{
  background:linear-gradient(135deg,#b8ffff,#5ad7e6);
  border-radius:30px;
  padding:32px 24px;
  width:100%;
  max-width:420px;
  text-align:center;
  color:#003b44;
}

.overlay-title{
  font-size:6vw;
  font-weight:800;
  margin-bottom:20px;
}

.word{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:18px;
  border:none;
  text-align:center;
  font-size:5vw;
  font-weight:700;
  outline:none;
}

.check{
  margin-top:18px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:22px;
  background:#004b8d;
  color:white;
  font-weight:800;
  font-size:4.8vw;
}

.hint{
  margin-top:16px;
  font-size:4.5vw;
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
// 💙 ADJETIVOS VÁLIDOS
const adjetivosValidos = [
  "mi compa","linda","guapa","pechocha","bonita",
  "inteligente","sonriente","risueña","ternurita"
];

// 🔧 NORMALIZADOR
function normalizar(texto){
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g,"");
}

const validosNormalizados = adjetivosValidos.map(normalizar);

const mensajes=[
 "😅 Sigue intentando\nesto recién empieza",
 "😉 Vamos de nuevo\nconfía en mí",
 "ADJETIVOS",
 "🧸 Sorpresa:\nUn peluchito Plincito 💙",
 "📅 Anótalo bien:\n16 de enero",
 "📸 “Quizás debí tomar más fotos\nde cuando te tuve…”\n\n🎤 Bad Bunny 💙"
];

const grid=document.getElementById("grid");
let currentIndex=0;

function crearCard(index){
  const card=document.createElement("div");
  card.className="card";

  const inner=document.createElement("div");
  inner.className="card-inner";

  const front=document.createElement("div");
  front.className="face front locked";

  const back=document.createElement("div");
  back.className="face back";
  if(index!==2) back.textContent=mensajes[index];

  const canvas=document.createElement("canvas");
  front.appendChild(canvas);

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);
  grid.appendChild(card);

  const ctx=canvas.getContext("2d");
  canvas.width=front.clientWidth;
  canvas.height=front.clientHeight;
  ctx.fillStyle="#b7f0f4";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalCompositeOperation="destination-out";

  let draw=false;

  function scratch(e){
    if(!draw||index!==currentIndex)return;
    const r=canvas.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    ctx.beginPath();
    ctx.arc(x,y,canvas.width*.22,0,Math.PI*2);
    ctx.fill();
  }

  function check(){
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    let clear=0;
    for(let i=3;i<img.data.length;i+=4) if(img.data[i]===0) clear++;
    if(clear/(canvas.width*canvas.height)>0.35) unlock();
  }

  function unlock(){
    canvas.remove();
    card.classList.add("flip");

    const boom=document.createElement("div");
    boom.className="explosion";
    card.appendChild(boom);
    setTimeout(()=>boom.remove(),1000);

    if(index===2){
      setTimeout(mostrarOverlay,1200);
      return;
    }
    currentIndex++;
  }

  canvas.addEventListener("touchstart",()=>{if(index===currentIndex)draw=true});
  canvas.addEventListener("touchmove",scratch);
  canvas.addEventListener("touchend",()=>{draw=false;check()});
  canvas.addEventListener("mousedown",()=>{if(index===currentIndex)draw=true});
  canvas.addEventListener("mousemove",scratch);
  canvas.addEventListener("mouseup",()=>{draw=false;check()});
}

function mostrarOverlay(){
  let intentos=0;
  const overlay=document.createElement("div");
  overlay.className="overlay";
  overlay.innerHTML=`
    <div class="overlay-box">
      <div class="overlay-title">💭 Completa lo que siempre te digo…</div>
      <input class="word" placeholder="Eres…">
      <input class="word" placeholder="Eres…">
      <input class="word" placeholder="Eres…">
      <button class="check">Comprobar 💙</button>
      <div class="hint"></div>
    </div>
  `;
  document.body.appendChild(overlay);

  const btn=overlay.querySelector(".check");
  const inputs=overlay.querySelectorAll(".word");
  const hint=overlay.querySelector(".hint");

  btn.onclick=()=>{
    const values=[...inputs].map(i=>normalizar(i.value));
    intentos++;

    const ok = values.every(v=>validosNormalizados.includes(v));

    if(ok){
      hint.textContent="💙 Exacto… siempre lo has sabido";
      setTimeout(()=>{
        overlay.remove();
        currentIndex++;
      },900);
    }else{
      hint.textContent = intentos===1
        ? "kheeeeeeeeee no eres 😝"
        : "Si sabesssss, tu puedesssss! 💙";
    }
  };
}

mensajes.forEach((_,i)=>crearCard(i));
</script>

</body>
</html>
