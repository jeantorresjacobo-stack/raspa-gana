<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Un pequeño detalle con mucho cariño 🫰🏻</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}

body{
  background:linear-gradient(180deg,#002b5c,#004b8d);
  font-family:'Segoe UI',Arial,sans-serif;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  padding:12px;
  width:100%;
  height:100%;
}

.card{perspective:1200px}
.card-inner{
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,1.6,.4,1);
}
.card.flip .card-inner{transform:rotateY(180deg)}

.face{
  position:absolute;inset:0;
  border-radius:22px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:16px;
  font-size:5vw;
  font-weight:800;
  white-space:pre-line;
}

.front{background:linear-gradient(135deg,#1ecad3,#00a7b3)}
.back{
  background:linear-gradient(135deg,#b8ffff,#5ad7e6);
  transform:rotateY(180deg);
  color:#003b44;
}

canvas{position:absolute;inset:0;border-radius:22px}

.locked::after{
  content:"🔒";
  position:absolute;
  font-size:12vw;
  z-index:5;
}

.explosion{
  position:absolute;inset:0;border-radius:22px;
  background:radial-gradient(circle,
    rgba(255,255,255,1) 0%,
    rgba(111,252,255,.8) 40%,
    rgba(111,252,255,0) 75%);
  animation:boom 1.1s ease-out forwards;
  pointer-events:none;
}
@keyframes boom{
  0%{opacity:0;transform:scale(.4)}
  50%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.6)}
}

.overlay{
  position:fixed;inset:0;z-index:1500;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#002b5c,#004b8d);
}
.overlay-box{
  background:linear-gradient(135deg,#b8ffff,#5ad7e6);
  border-radius:32px;
  padding:34px 26px;
  width:90%;max-width:420px;
  text-align:center;
}
.overlay-title{font-size:6vw;font-weight:900;margin-bottom:20px}
.word{
  width:100%;padding:16px;margin:10px 0;
  border-radius:20px;border:none;
  text-align:center;font-size:5vw;font-weight:700;
}
.check{
  margin-top:18px;padding:16px;width:100%;
  border:none;border-radius:26px;
  background:#004b8d;color:white;
  font-size:5vw;font-weight:900;
}
.hint{margin-top:18px;font-size:4.8vw;font-weight:800}

.final-screen{
  position:fixed;inset:0;z-index:3000;
  background:radial-gradient(circle,#b8ffff,#004b8d);
  display:flex;
  align-items:center;
  justify-content:center;
}

.final-text{
  text-align:center;
  font-size:6.5vw;
  font-weight:900;
  color:#003b44;
  max-width:85%;
  line-height:1.5;
  white-space:pre-line;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>
<audio id="finalSong" src="badbunny.mp3"></audio>

<script>
const mensajes=[
 "🫣 Sigue intentando",
 "😉 Es una sorpresa \no tan sorpresa",
 "ADJETIVOS",
 "🧸 Sorpresa:\nUn Plincito 🙈🫰🏻",
 "📅 Anótalo bien:\n16 de enero",
 "FINAL"
];

const finalMensaje=`🎶 “Si te quieres divertir,
con encanto y con primor…”

💙🐰 Bad Bunny
🎟️🎤 Concierto`;

const adjetivosValidos=[
 "mi compa","linda","guapa","pechocha","bonita",
 "inteligente","sonriente","risueña","ternurita"
];

const normalizar=t=>t.toLowerCase().normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"");

const validos=adjetivosValidos.map(normalizar);
const grid=document.getElementById("grid");
let currentIndex=0;

const AudioCtx=window.AudioContext||window.webkitAudioContext;
const audioCtx=new AudioCtx();
let osc=null;

function startScratchSound(){
  audioCtx.resume();
  if(osc) return;
  osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.frequency.value=320;
  gain.gain.value=0.05;
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
}
function stopScratchSound(){if(osc){osc.stop();osc=null;}}

function crearCard(index){
  const card=document.createElement("div");
  card.className="card";

  const inner=document.createElement("div");
  inner.className="card-inner";

  const front=document.createElement("div");
  front.className="face front locked";

  const back=document.createElement("div");
  back.className="face back";
  if(index!==2 && index!==5) back.textContent=mensajes[index];

  const canvas=document.createElement("canvas");
  front.appendChild(canvas);
  inner.append(front,back);
  card.appendChild(inner);
  grid.appendChild(card);

  requestAnimationFrame(()=>{
    canvas.width=front.clientWidth;
    canvas.height=front.clientHeight;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#b7f0f4";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation="destination-out";

    let draw=false;

    function scratch(e){
      if(!draw||index!==currentIndex)return;
      const r=canvas.getBoundingClientRect();
      const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
      const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
      ctx.beginPath();
      ctx.arc(x,y,canvas.width*.25,0,Math.PI*2);
      ctx.fill();
    }

    function check(){
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      let clear=0;
      for(let i=3;i<img.data.length;i+=4) if(img.data[i]===0) clear++;
      if(clear/(canvas.width*canvas.height)>0.35) unlock();
    }

    function unlock(){
      canvas.remove();
      front.classList.remove("locked");
      card.classList.add("flip");
      if(index===2) return mostrarOverlay(back);
      if(index===5) return finalPantalla();
      currentIndex++;
    }

    canvas.onmousedown=()=>{if(index===currentIndex){draw=true;startScratchSound();}};
    canvas.onmousemove=scratch;
    canvas.onmouseup=()=>{draw=false;stopScratchSound();check();};
    canvas.ontouchstart=()=>{draw=true;startScratchSound();};
    canvas.ontouchmove=scratch;
    canvas.ontouchend=()=>{draw=false;stopScratchSound();check();};
  });
}

function mostrarOverlay(back){
  const overlay=document.createElement("div");
  overlay.className="overlay";
  overlay.innerHTML=`
    <div class="overlay-box">
      <div class="overlay-title">💭 Completa con adjetivos que siempre te digo…</div>
      <input class="word"><input class="word"><input class="word">
      <button class="check">Comprobar 💙</button>
      <div class="hint"></div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector(".check").onclick=()=>{
    const values=[...overlay.querySelectorAll(".word")].map(i=>i.value);
    if(values.map(normalizar).every(v=>validos.includes(v))){
      back.innerHTML=`💙 Siempre eres:\n\n${values.join("\n")}`;
      overlay.remove();
      currentIndex++;
    }
  };
}

function finalPantalla(){
  const fs=document.createElement("div");
  fs.className="final-screen";
  fs.innerHTML=`<div class="final-text">${finalMensaje}</div>`;
  document.body.appendChild(fs);
  document.getElementById("finalSong").play().catch(()=>{});
}

mensajes.forEach((_,i)=>crearCard(i));
</script>

</body>
</html>
