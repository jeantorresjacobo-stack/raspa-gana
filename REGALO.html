<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Un pequeño detalle para ti 💙</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 100vw;
    height: 100vh;
    background: linear-gradient(180deg, #002b5c, #004b8d);
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100vw;
    height: 100vh;
    gap: 10px;
    padding: 10px;
  }

  .cell {
    position: relative;
    background: linear-gradient(135deg, #1ecad3, #00a7b3);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 14px;
    font-size: 5vw;
    font-weight: 700;
    border-radius: 20px;
    overflow: hidden;
    color: #003b44;
    box-shadow: 0 8px 18px rgba(0,0,0,.25);
    white-space: pre-line;
  }

  canvas {
    position: absolute;
    inset: 0;
    touch-action: none;
  }

  .locked::after {
    content: "🔒";
    position: absolute;
    font-size: 12vw;
    z-index: 2;
    opacity: .9;
  }
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
/*
  ORDEN DE REVELADO 💙
  1️⃣ Sigue intentando
  2️⃣ Sigue intentando
  3️⃣ 🧸 Plincito
  4️⃣ Pista cumpleaños
  5️⃣ Fecha
  6️⃣ Bad Bunny
*/
const mensajes = [
  "😅 Sigue intentando\nesto recién empieza",
  "😉 Vamos de nuevo\nconfía en mí",
  "🧸 Sorpresa:\nUn peluchito Plincito\npara ti 💙",
  "🎂 Pista:\nPasa 12 días antes\nde tu cumpleaños",
  "📅 Anótalo bien:\n16 de enero",
  "🎤 Es oficial:\nTu entrada para ver a Bad Bunny 💙"
];

const grid = document.getElementById("grid");
let currentIndex = 0;

function crearCuadro(index) {
  const cell = document.createElement("div");
  cell.className = "cell";
  if (index !== 0) cell.classList.add("locked");

  cell.textContent = mensajes[index];

  const canvas = document.createElement("canvas");
  cell.appendChild(canvas);
  grid.appendChild(cell);

  function resizeCanvas() {
    canvas.width = cell.clientWidth;
    canvas.height = cell.clientHeight;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#b7f0f4";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "destination-out";
  }

  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  const ctx = canvas.getContext("2d");
  let isDrawing = false;

  function draw(e) {
    if (!isDrawing || index !== currentIndex) return;

    const rect = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

    ctx.beginPath();
    ctx.arc(x, y, canvas.width * 0.17, 0, Math.PI * 2);
    ctx.fill();
  }

  function checkScratch() {
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clear = 0;

    for (let i = 3; i < img.data.length; i += 4) {
      if (img.data[i] === 0) clear++;
    }

    if (clear / (canvas.width * canvas.height) > 0.35) unlock();
  }

  function unlock() {
    canvas.remove();
    cell.classList.remove("locked");
    currentIndex++;
    if (grid.children[currentIndex]) {
      grid.children[currentIndex].classList.remove("locked");
    }
  }

  canvas.addEventListener("touchstart", () => {
    if (index !== currentIndex) return;
    isDrawing = true;
  });

  canvas.addEventListener("touchmove", draw);
  canvas.addEventListener("touchend", () => {
    isDrawing = false;
    checkScratch();
  });

  canvas.addEventListener("mousedown", () => {
    if (index !== currentIndex) return;
    isDrawing = true;
  });

  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", () => {
    isDrawing = false;
    checkScratch();
  });
}

mensajes.forEach((_, i) => crearCuadro(i));
</script>

</body>
</html>
