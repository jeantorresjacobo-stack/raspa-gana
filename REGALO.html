<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Un pequeño detalle para ti 💙</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  width:100vw;height:100vh;
  background:linear-gradient(180deg,#002b5c,#004b8d);
  font-family:'Segoe UI',Arial,sans-serif;
  overflow:hidden;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  padding:12px;
  width:100vw;height:100vh;
}

/* CARD 3D */
.card{perspective:1000px}
.card-inner{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.4,1.6,.4,1);
}
.card.flip .card-inner{transform:rotateY(180deg)}

.face{
  position:absolute;inset:0;
  border-radius:22px;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:14px;
  font-size:5vw;
  font-weight:700;
  white-space:pre-line;
}

.front{
  background:linear-gradient(135deg,#1ecad3,#00a7b3);
  color:#003b44;
  box-shadow:0 8px 18px rgba(0,0,0,.25);
}

.back{
  background:linear-gradient(135deg,#b8ffff,#5ad7e6);
  color:#003b44;
  transform:rotateY(180deg);
}

/* FINAL */
.final{
  font-family:Georgia,serif;
  font-size:5.4vw;
}

/* CANVAS */
canvas{
  position:absolute;
  inset:0;
  border-radius:22px;
  touch-action:none;
}

/* LOCK */
.locked::after{
  content:"🔒";
  position:absolute;
  font-size:12vw;
  z-index:3;
}

/* EXPLOSIÓN */
.explosion{
  position:absolute;
  width:20px;height:20px;
  border-radius:50%;
  background:#fff;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  animation:boom .8s ease-out forwards;
  pointer-events:none;
}

@keyframes boom{
  0%{opacity:1;box-shadow:0 0 0 0 #6ffcff}
  100%{
    opacity:0;
    box-shadow:0 0 0 40px rgba(111,252,255,0),
               0 0 60px 30px rgba(111,252,255,.5);
  }
}

/* PLINCITO */
.plincito{
  animation:bounce 1s cubic-bezier(.34,1.56,.64,1);
}
@keyframes bounce{
  0%{transform:scale(.3)}
  60%{transform:scale(1.2)}
  100%{transform:scale(1)}
}

/* ADJETIVOS */
.word{
  width:28%;
  padding:6px;
  margin:4px;
  border-radius:10px;
  border:none;
  text-align:center;
  font-size:4vw;
}

.check{
  margin-top:8px;
  padding:8px 14px;
  border:none;
  border-radius:14px;
  background:#004b8d;
  color:white;
  font-weight:700;
}

.hint{
  margin-top:6px;
  font-size:3.5vw;
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
// ✨ CAMBIA ESTOS ADJETIVOS POR LOS TUYOS
const adjetivosCorrectos = ["hermosa","única","increíble"];

const mensajes = [
 "😅 Sigue intentando\nesto recién empieza",
 "😉 Vamos de nuevo\nconfía en mí",
 "ADJETIVOS",
 "🧸 Sorpresa:\nUn peluchito Plincito 💙",
 "📅 Anótalo bien:\n16 de enero",
 "📸 “Quizás debí tomar más fotos\nde cuando te tuve…”\n\n🎤 Bad Bunny 💙\n\nPorque contigo\ntodo se siente mejor"
];

const grid=document.getElementById("grid");
let currentIndex=0;

function crearCard(index){
  const card=document.createElement("div");
  card.className="card";

  const inner=document.createElement("div");
  inner.className="card-inner";

  const front=document.createElement("div");
  front.className="face front locked";

  const back=document.createElement("div");
  back.className="face back";

  if(index===2){
    back.innerHTML=`
      💭 Completa lo que siempre te digo…<br><br>
      Eres<br><br>
      <input class="word" placeholder="___">
      <input class="word" placeholder="___">
      <input class="word" placeholder="___">
      <br><br>
      <button class="check">Comprobar 💙</button>
      <p class="hint"></p>
    `;
  }else{
    back.textContent=mensajes[index];
  }

  if(index===5) back.classList.add("final");

  const canvas=document.createElement("canvas");
  front.appendChild(canvas);

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);
  grid.appendChild(card);

  const ctx=canvas.getContext("2d");

  function resize(){
    canvas.width=front.clientWidth;
    canvas.height=front.clientHeight;
    ctx.fillStyle="#b7f0f4";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation="destination-out";
  }
  resize();

  let draw=false;
  function scratch(e){
    if(!draw||index!==currentIndex)return;
    const r=canvas.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
    ctx.beginPath();
    ctx.arc(x,y,canvas.width*.18,0,Math.PI*2);
    ctx.fill();
  }

  function check(){
    const img=ctx.getImageData(0,0,canvas.width,canvas.height);
    let clear=0;
    for(let i=3;i<img.data.length;i+=4)
      if(img.data[i]===0)clear++;
    if(clear/(canvas.width*canvas.height)>0.35)unlock();
  }

  function unlock(){
    canvas.remove();
    front.classList.remove("locked");
    card.classList.add("flip");

    const boom=document.createElement("div");
    boom.className="explosion";
    card.appendChild(boom);
    setTimeout(()=>boom.remove(),800);

    if(index===2){
      const btn=back.querySelector(".check");
      const inputs=back.querySelectorAll(".word");
      const hint=back.querySelector(".hint");

      btn.addEventListener("click",()=>{
        const values=[...inputs].map(i=>i.value.toLowerCase().trim());
        if(values.every(v=>adjetivosCorrectos.includes(v))){
          hint.textContent="💙 Exacto… siempre lo has sabido";
          currentIndex++;
        }else{
          hint.textContent="😉 Pista: te lo digo más de lo que crees";
        }
      });
      return;
    }

    if(index===3) back.classList.add("plincito");
    currentIndex++;
  }

  canvas.addEventListener("touchstart",()=>{if(index===currentIndex)draw=true});
  canvas.addEventListener("touchmove",scratch);
  canvas.addEventListener("touchend",()=>{draw=false;check()});

  canvas.addEventListener("mousedown",()=>{if(index===currentIndex)draw=true});
  canvas.addEventListener("mousemove",scratch);
  canvas.addEventListener("mouseup",()=>{draw=false;check()});
}

mensajes.forEach((_,i)=>crearCard(i));
</script>

</body>
</html>
